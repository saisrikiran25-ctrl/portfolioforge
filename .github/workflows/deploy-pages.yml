name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force Pages to use GitHub Actions builds
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const pages = await github.request("GET /repos/{owner}/{repo}/pages", {
                owner: context.repo.owner,
                repo: context.repo.repo,
              });

              if (pages.data.build_type !== "workflow") {
                await github.request("PATCH /repos/{owner}/{repo}/pages", {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  build_type: "workflow",
                });
              }

              core.info("Pages source is set to GitHub Actions (build_type=workflow).");
            } catch (error) {
              const status = error.status ?? error.response?.status;
              if (status === 404) {
                core.warning("GitHub Pages is not enabled for this repository yet.");
              } else if (status === 403) {
                core.warning("Insufficient permission to update Pages settings. Confirm pages:write permission.");
              } else {
                core.warning(`Could not update Pages build_type to workflow: ${error.message}`);
              }
            }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    env:
      PAGES_MIGRATION_WAIT_SECONDS: 45
    steps:
      - name: Wait for legacy Pages deployment race window
        # TODO: Remove this once branch-based "pages build and deployment" no longer triggers for this repository.
        # During migration from branch-based Pages, GitHub may still trigger an auto Jekyll deployment.
        # 45s is based on observed branch-based deployment completion time (~20-35s) with safety margin.
        # Waiting helps ensure this workflow's deploy finishes last and remains the active site.
        run: sleep "$PAGES_MIGRATION_WAIT_SECONDS"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
