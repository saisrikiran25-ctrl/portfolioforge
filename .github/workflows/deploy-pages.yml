name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force Pages to use GitHub Actions builds
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const pages = await github.request("GET /repos/{owner}/{repo}/pages", {
                owner: context.repo.owner,
                repo: context.repo.repo,
              });

              if (pages.data.build_type !== "workflow") {
                await github.request("PATCH /repos/{owner}/{repo}/pages", {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  build_type: "workflow",
                });
              }

              core.info("Pages source is set to GitHub Actions (build_type=workflow).");
            } catch (error) {
              const status = error.status ?? error.response?.status;
              if (status === 404) {
                core.warning("GitHub Pages is not enabled for this repository yet.");
              } else if (status === 403) {
                core.warning("Insufficient permission to update Pages settings. Confirm pages:write permission.");
              } else {
                core.warning(`Could not update Pages build_type to workflow: ${error.message}`);
              }
            }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Wait for any branch-based Pages deployment on this commit
        uses: actions/github-script@v7
        with:
          script: |
            const waitingStatuses = new Set(["queued", "in_progress", "requested", "waiting"]);
            const maxChecks = 18;
            const intervalMs = 5000;

            for (let attempt = 1; attempt <= maxChecks; attempt++) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });

              const legacyRuns = runs.filter(
                (run) =>
                  run.name === "pages build and deployment" &&
                  run.head_sha === context.sha &&
                  waitingStatuses.has(run.status),
              );

              if (legacyRuns.length === 0) {
                core.info("No in-progress branch-based Pages deployment found for this commit.");
                break;
              }

              core.info(
                `Waiting for legacy Pages deployment to finish (${attempt}/${maxChecks})...`,
              );
              await new Promise((resolve) => setTimeout(resolve, intervalMs));
            }

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
